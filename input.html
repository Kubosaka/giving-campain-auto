<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ユーザー情報入力フォーム</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>ユーザー情報入力フォーム</h1>
    <form id="userForm">
      <label for="lastName">姓:</label>
      <input
        type="text"
        id="lastName"
        placeholder="例: 山田"
        required
      /><br /><br />

      <label for="firstName">名:</label>
      <input
        type="text"
        id="firstName"
        placeholder="例: 太郎"
        required
      /><br /><br />

      <label for="kanaLastName">姓（かな）:</label>
      <input
        type="text"
        id="kanaLastName"
        placeholder="例: やまだ"
        required
      /><br /><br />

      <label for="kanaFirstName">名（かな）:</label>
      <input
        type="text"
        id="kanaFirstName"
        placeholder="例: たろう"
        required
      /><br /><br />

      <label for="gender">性別:</label>
      <select id="gender" required>
        <option value="男性">男性</option>
        <option value="女性">女性</option>
        <option value="回答しない">回答しない</option>
      </select>
      <br /><br />

      <label for="email">メールアドレス:</label>
      <input
        type="email"
        id="email"
        placeholder="例: test@example.com"
        required
      /><br /><br />

      <label for="tel">電話番号 (ハイフンなし):</label>
      <input
        type="tel"
        id="tel"
        placeholder="例: 00000000000"
        required
      /><br /><br />

      <label for="birthYear">生年:</label>
      <input
        type="number"
        id="birthYear"
        placeholder="例: 2000"
        required
      /><br /><br />

      <label for="birthMonth">生月:</label>
      <input
        type="number"
        id="birthMonth"
        placeholder="例: 1"
        required
      /><br /><br />

      <label for="birthDay">生日:</label>
      <input
        type="number"
        id="birthDay"
        placeholder="例: 1"
        required
      /><br /><br />

      <label for="prefecture">出身地（都道府県）:</label>
      <select id="prefecture" required>
        <option value="">選択してください</option>
        <option value="北海道">北海道</option>
        <option value="青森県">青森県</option>
        <option value="岩手県">岩手県</option>
        <option value="宮城県">宮城県</option>
        <option value="秋田県">秋田県</option>
        <option value="山形県">山形県</option>
        <option value="福島県">福島県</option>
        <option value="茨城県">茨城県</option>
        <option value="栃木県">栃木県</option>
        <option value="群馬県">群馬県</option>
        <option value="埼玉県">埼玉県</option>
        <option value="千葉県">千葉県</option>
        <option value="東京都">東京都</option>
        <option value="神奈川県">神奈川県</option>
        <option value="新潟県">新潟県</option>
        <option value="富山県">富山県</option>
        <option value="石川県">石川県</option>
        <option value="福井県">福井県</option>
        <option value="山梨県">山梨県</option>
        <option value="長野県">長野県</option>
        <option value="岐阜県">岐阜県</option>
        <option value="静岡県">静岡県</option>
        <option value="愛知県">愛知県</option>
        <option value="三重県">三重県</option>
        <option value="滋賀県">滋賀県</option>
        <option value="京都府">京都府</option>
        <option value="大阪府">大阪府</option>
        <option value="兵庫県">兵庫県</option>
        <option value="奈良県">奈良県</option>
        <option value="和歌山県">和歌山県</option>
        <option value="鳥取県">鳥取県</option>
        <option value="島根県">島根県</option>
        <option value="岡山県">岡山県</option>
        <option value="広島県">広島県</option>
        <option value="山口県">山口県</option>
        <option value="徳島県">徳島県</option>
        <option value="香川県">香川県</option>
        <option value="愛媛県">愛媛県</option>
        <option value="高知県">高知県</option>
        <option value="福岡県">福岡県</option>
        <option value="佐賀県">佐賀県</option>
        <option value="長崎県">長崎県</option>
        <option value="熊本県">熊本県</option>
        <option value="大分県">大分県</option>
        <option value="宮崎県">宮崎県</option>
        <option value="鹿児島県">鹿児島県</option>
        <option value="沖縄県">沖縄県</option></select
      ><br /><br />

      <label for="city">出身地（市区町村）:</label>
      <input type="text" id="city" placeholder="例: 長岡市" /><br /><br />

      <label for="message">応援メッセージ:</label><br />
      <textarea
        id="message"
        rows="4"
        cols="40"
        placeholder="例: 技大祭実行委員会です。一緒に頑張りましょう!!"
        defaultValue="技大祭実行委員会です。一緒に頑張りましょう!!"
      ></textarea>
      <br /><br />

      <button type="button" id="submitBtn">保存</button>
    </form>

    <pre id="output"></pre>

    <script src="input.js"></script>
  </body>
</html>
