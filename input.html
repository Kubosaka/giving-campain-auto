<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ユーザー情報入力フォーム</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>ユーザー情報入力フォーム</h1>
    <form id="userForm">
      <label for="lastName">姓:</label>
      <input
        type="text"
        id="lastName"
        placeholder="例: 山田"
        required
      /><br /><br />

      <label for="firstName">名:</label>
      <input
        type="text"
        id="firstName"
        placeholder="例: 太郎"
        required
      /><br /><br />

      <label for="kanaLastName">姓（かな）:</label>
      <input
        type="text"
        id="kanaLastName"
        placeholder="例: やまだ"
        required
      /><br /><br />

      <label for="kanaFirstName">名（かな）:</label>
      <input
        type="text"
        id="kanaFirstName"
        placeholder="例: たろう"
        required
      /><br /><br />

      <label for="gender">性別:</label>
      <select id="gender" required>
        <option value="男性">男性</option>
        <option value="女性">女性</option>
        <option value="回答しない">回答しない</option>
      </select>
      <br /><br />

      <label for="email">メールアドレス:</label>
      <input
        type="email"
        id="email"
        placeholder="例: test@example.com"
        required
      /><br /><br />

      <label for="tel">電話番号 (ハイフンなし):</label>
      <input
        type="tel"
        id="tel"
        placeholder="例: 00000000000"
        required
      /><br /><br />

      <label for="birthYear">生年:</label>
      <input
        type="number"
        id="birthYear"
        placeholder="例: 2000"
        required
      /><br /><br />

      <label for="birthMonth">生月:</label>
      <input
        type="number"
        id="birthMonth"
        placeholder="例: 1"
        required
      /><br /><br />

      <label for="birthDay">生日:</label>
      <input
        type="number"
        id="birthDay"
        placeholder="例: 1"
        required
      /><br /><br />

      <label for="prefecture">出身地（都道府県）:</label>
      <select id="prefecture" required>
        <option value="">選択してください</option>
        <option value="0">北海道</option>
        <option value="1">青森県</option>
        <option value="2">岩手県</option>
        <option value="3">宮城県</option>
        <option value="4">秋田県</option>
        <option value="5">山形県</option>
        <option value="6">福島県</option>
        <option value="7">茨城県</option>
        <option value="8">栃木県</option>
        <option value="9">群馬県</option>
        <option value="10">埼玉県</option>
        <option value="11">千葉県</option>
        <option value="12">東京都</option>
        <option value="13">神奈川県</option>
        <option value="14">新潟県</option>
        <option value="15">富山県</option>
        <option value="16">石川県</option>
        <option value="17">福井県</option>
        <option value="18">山梨県</option>
        <option value="19">長野県</option>
        <option value="20">岐阜県</option>
        <option value="21">静岡県</option>
        <option value="22">愛知県</option>
        <option value="23">三重県</option>
        <option value="24">滋賀県</option>
        <option value="25">京都府</option>
        <option value="26">大阪府</option>
        <option value="27">兵庫県</option>
        <option value="28">奈良県</option>
        <option value="29">和歌山県</option>
        <option value="30">鳥取県</option>
        <option value="31">島根県</option>
        <option value="32">岡山県</option>
        <option value="33">広島県</option>
        <option value="34">山口県</option>
        <option value="35">徳島県</option>
        <option value="36">香川県</option>
        <option value="37">愛媛県</option>
        <option value="38">高知県</option>
        <option value="39">福岡県</option>
        <option value="40">佐賀県</option>
        <option value="41">長崎県</option>
        <option value="42">熊本県</option>
        <option value="43">大分県</option>
        <option value="44">宮崎県</option>
        <option value="45">鹿児島県</option>
        <option value="46">沖縄県</option></select
      ><br /><br />

      <label for="city">出身地（市区町村）:</label>
      <input type="text" id="city" placeholder="例: 長岡市" /><br /><br />

      <label for="groupRelationship">あなたと応援団体の関係:</label>
      <select id="groupRelationship" required>
        <option value="0">友人・知人</option>
        <option value="1">卒業生</option>
        <option value="2">教職員</option>
        <option value="3">ご家族・ご親戚</option>
        <option value="4">他大学の学生</option>
        <option value="5">その他</option></select
      ><br /><br />

      <hr />
      <h2>大学情報</h2>

      <label for="universityName">大学名:</label>
      <select id="universityName" required>
        <option value="長岡技術科学大学">長岡技術科学大学</option></select
      ><br /><br />

      <label for="graduationYear">卒業/修了見込み年:</label>
      <input
        type="number"
        id="graduationYear"
        placeholder="例: 2025"
        required
      /><br /><br />

      <label for="graduationMonth">卒業/修了見込み月:</label>
      <input
        type="number"
        id="graduationMonth"
        placeholder="例: 3"
        required
      /><br /><br />

      <label for="majorCategory">文系・理系:</label>
      <select id="majorCategory" required>
        <option value="humanities">文系</option>
        <option value="science">理系</option>
        <option value="other">その他</option>
      </select>
      <br /><br />

      <label for="faculty">学部・研究科:</label>
      <input type="text" id="faculty" placeholder="例: 工学部" /><br /><br />

      <label for="department">学科・専攻:</label>
      <input
        type="text"
        id="department"
        placeholder="例: 情報・経営システム工学課程"
      /><br /><br />

      <hr />

      <label for="message">応援メッセージ:</label><br />
      <textarea
        id="message"
        rows="4"
        cols="40"
        placeholder="例: 技大祭実行委員会です。一緒に頑張りましょう!!"
        defaultValue="技大祭実行委員会です。一緒に頑張りましょう!!"
      ></textarea>
      <br /><br />

      <button type="button" id="submitBtn">保存</button>
    </form>

    <pre id="output"></pre>

    <script src="input.js"></script>
  </body>
</html>
